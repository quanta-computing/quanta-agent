name: "quanta-agent-apache"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Experience Monitoring Apache plugin
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - quanta-agent-base = ${VERSION}
  deb:
    depends:
      - quanta-agent-base (= ${VERSION})

contents:
  - src: /tmp/staging/@LIBDIR@/apache.so
    dst: /@LIBDIR/quanta/modules/apache.so

  - src: /tmp/staging/etc/quanta/modules.d/apache.yml
    dst: /etc/quanta/modules.d/apache.yml
    type: config|noreplace
