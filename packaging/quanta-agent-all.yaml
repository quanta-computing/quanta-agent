name: "quanta-agent-all"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Experience Monitoring agent with all plugins
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - quanta-agent-base = ${VERSION}
      - quanta-agent-cpu = ${VERSION}
      - quanta-agent-disk = ${VERSION}
      - quanta-agent-memory = ${VERSION}
      - quanta-agent-network = ${VERSION}
      - quanta-agent-process = ${VERSION}
      - quanta-agent-system = ${VERSION}
      - quanta-agent-apache = ${VERSION}
      - quanta-agent-memcached = ${VERSION}
      - quanta-agent-mysql = ${VERSION}
      - quanta-agent-nfs = ${VERSION}
      - quanta-agent-nginx = ${VERSION}
      - quanta-agent-postgresql = ${VERSION}
      - quanta-agent-redis = ${VERSION}
      - quanta-agent-varnish = ${VERSION}
  deb:
    depends:
      - quanta-agent-base (= ${VERSION})
      - quanta-agent-cpu (= ${VERSION})
      - quanta-agent-disk (= ${VERSION})
      - quanta-agent-memory (= ${VERSION})
      - quanta-agent-network (= ${VERSION})
      - quanta-agent-process (= ${VERSION})
      - quanta-agent-system (= ${VERSION})
      - quanta-agent-apache (= ${VERSION})
      - quanta-agent-memcached (= ${VERSION})
      - quanta-agent-mysql (= ${VERSION})
      - quanta-agent-nfs (= ${VERSION})
      - quanta-agent-nginx (= ${VERSION})
      - quanta-agent-postgresql (= ${VERSION})
      - quanta-agent-redis (= ${VERSION})
      - quanta-agent-varnish (= ${VERSION})

contents: []
