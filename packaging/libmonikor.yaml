name: "libmonikor"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Metric library for quanta-agent
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - "libcurl"
      - "libyaml"
  deb:
    depends:
      - "libcurl4 | libcurl4t64"
      - "libyaml-0-2"

contents:
  - src: /tmp/staging/@LIBDIR@/libmonikor.so*
    dst: /@LIBDIR@/
