name: "centreon-experience-agent-varnish"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Experience Monitoring Varnish plugin
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - centreon-experience-agent-base = ${VERSION}
    replaces:
      - quanta-agent-varnish
  deb:
    replaces:
      - quanta-agent-varnish
    conflicts:
      - quanta-agent-varnish
    depends:
      - centreon-experience-agent-base (>= ${VERSION})

scripts:
  postinstall: packaging/scripts/centreon-experience-agent-varnish.postinstall.sh

contents:
  - src: /tmp/staging/usr/lib/quanta/modules/varnish.so
    dst: /usr/lib/quanta/modules/varnish.so

  - src: /tmp/staging/etc/quanta/modules.d/varnish.yml
    dst: /etc/quanta/modules.d/varnish.yml
    type: config|noreplace
