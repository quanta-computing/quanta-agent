name: "centreon-experience-agent-all"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Experience Monitoring agent with all plugins
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - centreon-experience-agent-base = ${VERSION}
      - centreon-experience-agent-cpu = ${VERSION}
      - centreon-experience-agent-disk = ${VERSION}
      - centreon-experience-agent-memory = ${VERSION}
      - centreon-experience-agent-network = ${VERSION}
      - centreon-experience-agent-process = ${VERSION}
      - centreon-experience-agent-system = ${VERSION}
      - centreon-experience-agent-apache = ${VERSION}
      - centreon-experience-agent-memcached = ${VERSION}
      - centreon-experience-agent-mysql = ${VERSION}
      - centreon-experience-agent-nfs = ${VERSION}
      - centreon-experience-agent-nginx = ${VERSION}
      - centreon-experience-agent-postgresql = ${VERSION}
      - centreon-experience-agent-redis = ${VERSION}
      - centreon-experience-agent-varnish = ${VERSION}
    replaces:
      - quanta-agent-all
  deb:
    replaces:
      - quanta-agent-all
    conflicts:
      - quanta-agent-all
    depends:
      - centreon-experience-agent-base (>= ${VERSION})
      - centreon-experience-agent-cpu (>= ${VERSION})
      - centreon-experience-agent-disk (>= ${VERSION})
      - centreon-experience-agent-memory (>= ${VERSION})
      - centreon-experience-agent-network (>= ${VERSION})
      - centreon-experience-agent-process (>= ${VERSION})
      - centreon-experience-agent-system (>= ${VERSION})
      - centreon-experience-agent-apache (>= ${VERSION})
      - centreon-experience-agent-memcached (>= ${VERSION})
      - centreon-experience-agent-mysql (>= ${VERSION})
      - centreon-experience-agent-nfs (>= ${VERSION})
      - centreon-experience-agent-nginx (>= ${VERSION})
      - centreon-experience-agent-postgresql (>= ${VERSION})
      - centreon-experience-agent-redis (>= ${VERSION})
      - centreon-experience-agent-varnish (>= ${VERSION})

contents: []
