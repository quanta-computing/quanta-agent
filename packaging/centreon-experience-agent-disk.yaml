name: "centreon-experience-agent-disk"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Experience Monitoring disk plugin
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - centreon-experience-agent-base = ${VERSION}
    replaces:
      - quanta-agent-disk
  deb:
    replaces:
      - quanta-agent-disk
    conflicts:
      - quanta-agent-disk
    depends:
      - centreon-experience-agent-base (>= ${VERSION})

contents:
  - src: /tmp/staging/usr/lib/quanta/modules/disk.so
    dst: /usr/lib/quanta/modules/disk.so

  - src: /tmp/staging/etc/quanta/modules.d/disk.yml
    dst: /etc/quanta/modules.d/disk.yml
    type: config|noreplace
