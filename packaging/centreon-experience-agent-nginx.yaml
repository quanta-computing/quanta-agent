name: "centreon-experience-agent-nginx"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Experience Monitoring Nginx plugin
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - centreon-experience-agent-base = ${VERSION}
    replaces:
      - quanta-agent-nginx
  deb:
    replaces:
      - quanta-agent-nginx
    conflicts:
      - quanta-agent-nginx
    depends:
      - centreon-experience-agent-base (>= ${VERSION})

contents:
  - src: /tmp/staging/usr/lib/quanta/modules/nginx.so
    dst: /usr/lib/quanta/modules/nginx.so

  - src: /tmp/staging/etc/quanta/modules.d/nginx.yml
    dst: /etc/quanta/modules.d/nginx.yml
    type: config|noreplace
