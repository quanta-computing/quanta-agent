name: "quanta-agent-varnish"
arch: "${ARCH}"
platform: "linux"
version: "${VERSION}"
release: "${RELEASE}${DIST}"
version_schema: "none"
maintainer: "Centreon <contact@centreon.com>"
description: |
  Centreon Experience Monitoring Varnish plugin
  Commit: @COMMIT_HASH@
vendor: "Centreon"
homepage: "https://www.centreon.com"
license: "Apache-2.0"

overrides:
  rpm:
    depends:
      - quanta-agent-base = ${VERSION}
  deb:
    depends:
      - quanta-agent-base (= ${VERSION})

scripts:
  postinstall: packaging/scripts/quanta-agent-varnish.postinstall.sh

contents:
  - src: /tmp/staging/@LIBDIR@/varnish.so
    dst: /@LIBDIR@/quanta/modules/varnish.so

  - src: /tmp/staging/etc/quanta/modules.d/varnish.yml
    dst: /etc/quanta/modules.d/varnish.yml
    type: config|noreplace
